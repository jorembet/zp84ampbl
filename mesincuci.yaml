substitutions:
  name: mesincuci
  friendly_name: POW2 MESIN CUCI
  update_interval: 60s
  web_username: !secret web_username
  web_password: !secret web_password

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: esphome.web
    version: '1.0'

esp8266:
  board: esp01_1m

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

dashboard_import:
  package_import_url: github://esphome/example-configs/esphome-web/esp8266.yaml@main
  import_full_config: false

web_server:
  port: 80
  auth:
    username: ${web_username}
    password: ${web_password}

logger:
  baud_rate: 0

uart:
  rx_pin: RX
  baud_rate: 4800

time:
  - platform: sntp
    id: my_time
    timezone: Asia/Jakarta

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    name: "POW Button"
    internal: true
    on_press:
      - switch.toggle: relay

  - platform: template
    name: "RUN"
    id: machine_running
    filters:
      - delayed_on: 60s
      - delayed_off: 300s
    lambda: |-
      if (isnan(id(power).state)) {
        return {};
      } else if (id(power).state > 4) {
        return true;
      } else {
        return false;
      }
    on_press:
      then:
        - lambda: |-
            id(machine_end).publish_state(false);
            id(minimum_working_time).publish_state(false);
            id(cycle_centrifughe).publish_state(false);
            id(cycle_drain).publish_state(false);
        - light.turn_on: led
    on_release:
      then:
        - lambda: |-
            id(machine_end).publish_state(true);

  - platform: template
    name: "Washing Machine Minimum time"
    internal: true
    id: minimum_working_time
    filters:
      - delayed_on: 30min
      - delayed_off: 180s
    lambda: |-
      if (isnan(id(power).state)) {
        return {};
      } else if (id(power).state > 4) {
        return true;
      } else {
        return {};
      }

  - platform: template
    name: "CENTRIFUGE"
    id: cycle_centrifughe
    filters:
      - delayed_on: 60s
    lambda: |-
      if (isnan(id(power).state)) {
        return {};
      } else if ( (id(power).state > 100) && (id(power).state < 400) && (id(minimum_working_time).state) ) {
        return true;
      } else {
        return {};
      }

  - platform: template
    name: "DRAIN"
    id: cycle_drain
    filters:
      - delayed_on: 60s
    lambda: |-
      if (isnan(id(power).state)) {
        return {};
      } else if ( (id(power).state > 15) && (id(power).state < 60) ) {
        return true;
      } else {
        return {};
      }

  - platform: template
    name: "Pump ON"
    id: pump_on
    filters:
      - delayed_on: 60s
    lambda: |-
      if (isnan(id(power).state)) {
        return {};
      } else if ( (id(power).state > 15) && (id(power).state < 60) ) {
        return true;
      } else {
        return {};
      }

  - platform: template
    name: "Pump OFF"
    id: pump_off
    filters:
      - delayed_off: 60s
    lambda: |-
      if (isnan(id(power).state)) {
        return {};
      } else if ( (id(power).state > 15) && (id(power).state < 60) ) {
        return false;
      } else {
        return true;
      }

  - platform: template
    name: "END"
    id: machine_end
    on_press:
      - light.turn_off: led

switch:
  - platform: restart
    name: "Restart"

  - platform: gpio
    id: relay
    pin: GPIO12
    name: "Relay"
    restore_mode: ALWAYS_ON

output:
  - platform: esp8266_pwm
    id: pow_blue_led
    pin:
      number: GPIO13
      inverted: True

light:
  - platform: monochromatic
    name: "Blue LED"
    internal: true
    output: pow_blue_led
    id: led

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

  - platform: cse7766
    update_interval: 1s
    current:
      name: "Current"
      id: curr
      internal: true
      filters:
        - throttle_average: ${update_interval}
    voltage:
      name: "Voltage"
      id: volt
      internal: true
      filters:
        - throttle_average: ${update_interval}
    power:
      name: "Power"
      id: power
      internal: true
      filters:
        - throttle_average: ${update_interval}
    apparent_power:
      name: "Apparent Power"
      id: apparent_power
      filters:
        - throttle_average: ${update_interval}
    power_factor:
      name: "Power Factor"
      id: power_factor
      filters:
        - throttle_average: ${update_interval}
    energy:
      name: "Energy"
      id: energy
      filters:
        - throttle: ${update_interval}

  - platform: total_daily_energy
    name: "Total Daily Energy"
    power_id: power
    time_id: my_time
    filters:
      - multiply: 0.001
    unit_of_measurement: kWh
    accuracy_decimals: 1

  - platform: template
    name: "Pow Current Slow"
    lambda: |-
      if (id(curr).state) {
        return (id(curr).state);
      } else {
        return 0;
      }
    unit_of_measurement: A
    icon: "mdi:alpha-a-circle"
    update_interval: 90s

  - platform: template
    name: "Pow Voltage Slow"
    lambda: |-
      if (id(volt).state) {
        return (id(volt).state);
      } else {
        return 0;
      }
    unit_of_measurement: V
    icon: "mdi:alpha-v-circle"
    update_interval: 90s

  - platform: template
    name: "Pow Power Slow"
    lambda: |-
      if (id(power).state) {
        return (id(power).state);
      } else {
        return 0;
      }
    unit_of_measurement: W
    icon: "mdi:alpha-w-circle"
    update_interval: 90s

  - platform: template
    name: "CPU Frequency"
    lambda: |-
      return (float) ESP.getCpuFreqMHz();
    unit_of_measurement: "MHz"

text_sensor:
  - platform: version
    name: "Firmware Version"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
    bssid:
      name: "BSSID"
    ssid:
      name: "SSID"
    mac_address:
      name: "MAC"
